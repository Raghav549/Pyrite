name: Pyrite tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check pyrite tests
      - run: python -m pytest -q
      # The README documents these commands; keep them working in CI.
      - run: python -m pyrite status
      - run: python -m pyrite types --decodable-only
      - run: python -m pyrite route "write a Python API"
      - run: python -m pyrite.bench
