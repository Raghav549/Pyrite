[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrite-local-runtime"
version = "0.3.0"
description = "Privacy-first, memory-budgeted local AI runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pyrite = "pyrite.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    # Independent oracle and array support for decoder parity tests; not runtime deps.
    "gguf>=0.19",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["pyrite*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    # typing.Self only exists from Python 3.11; Pyrite supports 3.10.
    "PYI034",
    # Assertions are the test framework here.
    "S101",
]
